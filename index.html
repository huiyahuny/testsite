<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0d13" />
  <meta name="description" content="캐릭터와 세계관 소개 사이트" />
  <title>[사이트 이름을 쓰시오] — World Archive</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="site-shell">
    <aside class="sidebar" aria-label="주 메뉴">
      <div class="brand"><div class="brand-symbol" aria-hidden="true">✧</div><div><span class="brand-kicker" id="side-kicker">[사이트 분류를 쓰시오]</span><strong id="side-brand">[사이트 이름을 쓰시오]</strong></div></div>
      <div class="rail-rule"><span id="rail-year">[연도 입력]</span><span id="rail-volume">[분류 번호 입력]</span></div>
      <nav class="side-nav" id="main-nav">
        <button class="nav-btn active" data-page="home" aria-current="page"><span class="nav-index">01</span> HOME <span class="nav-arrow">↗</span></button>
        <button class="nav-btn" data-page="world"><span class="nav-index">02</span> WORLD <span class="nav-arrow">↗</span></button>
        <button class="nav-btn" data-page="characters"><span class="nav-index">03</span> CHARACTERS <span class="nav-arrow">↗</span></button>
        <button class="nav-btn" data-page="timeline"><span class="nav-index">04</span> TIMELINE <span class="nav-arrow">↗</span></button>
        <button class="nav-btn" data-page="archive"><span class="nav-index">05</span> ARCHIVE <span class="nav-arrow">↗</span></button>
      </nav>
      <div class="side-bottom"><div class="side-ornament">✦ &nbsp; — &nbsp; ✦</div><p id="side-motto">[왼쪽 하단 문구를 쓰시오]</p><span id="side-copyright">[저작권 표기를 쓰시오]</span></div>
    </aside>

    <main class="main-area" id="main-content">
      <header class="topbar"><span class="topbar-left"><span class="status-dot"></span><span id="topbar-status">[상단 상태 문구를 쓰시오]</span></span><span class="topbar-right" id="topbar-title">[사이트 이름을 쓰시오]</span></header>
      <div id="view" aria-live="polite"></div>
      <footer class="footer"><span id="footer-copyright">[저작권 표기를 쓰시오]</span><span>DESIGNED FOR STORIES THAT DESERVE TO REMAIN · <a href="admin.html" class="admin-foot-link" aria-label="관리자 편집 화면">ADMIN ↗</a></span></footer>
    </main>
  </div>

  <dialog id="character-dialog" class="character-dialog" aria-label="캐릭터 상세 프로필">
    <button id="modal-close" type="button" class="modal-close" aria-label="닫기">✕</button>
    <div id="modal-body"></div>
  </dialog>
</body>
</html>
